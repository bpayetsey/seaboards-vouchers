kind = "web"
previewPath = "/"
title = "Seaboards Group Vouchers"
version = "1.0.0"
id = "artifacts/group-vouchers"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20971

[services.development]
run = "pnpm --filter @workspace/group-vouchers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/group-vouchers", "run", "build" ]
publicDir = "artifacts/group-vouchers/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20971"
BASE_PATH = "/"
