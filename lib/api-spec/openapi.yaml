openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rates
    description: Voucher rate information
  - name: group-orders
    description: Group voucher orders
  - name: pay
    description: Per-person payment links
  - name: storefront
    description: Direct voucher storefront with Pay-in-3 instalments
  - name: dashboard
    description: Authenticated client account dashboard
  - name: admin
    description: Staff admin dashboard (Clerk session + staff allow-list)
  - name: Storage
    description: Object storage upload and serving endpoints
paths:
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the signed-in client's account dashboard
      description: >
        Returns all vouchers/credits, payments and downloadable Stripe receipts
        belonging to the authenticated client, matched strictly to their verified
        account email. Requires a Clerk session.
      responses:
        "200":
          description: Dashboard view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardView"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A verified email is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rates:
    get:
      operationId: getRates
      tags: [rates]
      summary: Get voucher rate table
      description: Authoritative apartment rate table used to price vouchers.
      responses:
        "200":
          description: Rate table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateTable"
  /group-orders:
    post:
      operationId: createGroupOrder
      tags: [group-orders]
      summary: Create a group voucher order
      description: >
        Creates a group order plus one payable line per person and returns the
        organiser status URL and a payment link for each payer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupOrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupOrderCreated"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /group-orders/{statusToken}:
    get:
      operationId: getGroupOrder
      tags: [group-orders]
      summary: Get organiser status view
      parameters:
        - name: statusToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organiser view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganiserView"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /group-orders/{statusToken}/lines/{lineId}/resend:
    post:
      operationId: resendLine
      tags: [group-orders]
      summary: Re-surface a payer's payment link
      parameters:
        - name: statusToken
          in: path
          required: true
          schema:
            type: string
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resend result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dashboard/group-orders/{orderId}/lines/{lineId}/resend:
    post:
      operationId: resendOrganisedLine
      tags: [dashboard]
      summary: Send a participant reminder for an order you organised
      description: >
        Re-surfaces a participant's payment link for a group order owned by the
        authenticated organiser. Scoped strictly to the verified account email —
        the organiser must own the order. Requires a Clerk session.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resend result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A verified email is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dashboard/orders/{orderId}/pay-instalments:
    post:
      operationId: payOrderInstalments
      tags: [dashboard]
      summary: Pay upcoming "Pay in 3" instalments in advance
      description: >
        Charges one or more upcoming instalments for a storefront order owned by
        the authenticated client against the card saved at checkout. Scoped
        strictly to the verified account email. Pass `numbers` to pay specific
        instalments, or omit it to pay all remaining upcoming instalments. Shares
        the daily charge job's atomic status claim so an instalment can never be
        double-charged. Requires a Clerk session.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayInstalmentsBody"
      responses:
        "200":
          description: Per-instalment outcome plus the refreshed order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayInstalmentsResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A verified email is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pay/{payToken}:
    get:
      operationId: getPayLine
      tags: [pay]
      summary: Get a payer's line details
      parameters:
        - name: payToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pay line details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayLine"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pay/{payToken}/checkout:
    post:
      operationId: createCheckout
      tags: [pay]
      summary: Create a Stripe Checkout session for a payer
      description: >
        Mints a fresh Stripe Checkout session for this payer's line and returns
        the hosted checkout URL to redirect to.
      parameters:
        - name: payToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already paid or closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Payments not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storefront/config:
    get:
      operationId: getStorefrontConfig
      tags: [storefront]
      summary: Storefront campaign config
      description: Catalog, currency, instalment settings and the Stripe publishable key.
      responses:
        "200":
          description: Storefront config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontConfig"
  /storefront/orders:
    post:
      operationId: createStoreOrder
      tags: [storefront]
      summary: Create a storefront order
      description: >
        Creates the order plus the first PaymentIntent (full payment or instalment
        #1 with the card saved for off-session instalments) and returns the
        client secret for the Stripe Payment Element.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOrderInput"
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderCreated"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Payments not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storefront/orders/{orderId}/confirm:
    post:
      operationId: confirmStoreOrder
      tags: [storefront]
      summary: Finalize an order after the browser confirms
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderConfirmation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storefront/jobs/charge-instalments:
    post:
      operationId: chargeInstalments
      tags: [storefront]
      summary: Charge due instalments off-session
      description: Scheduler-only. Requires a bearer token matching SESSION_SECRET.
      responses:
        "200":
          description: Job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeInstalmentsResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storefront/admin/orders:
    get:
      operationId: getStoreAdminOrders
      tags: [storefront]
      summary: Recent storefront orders
      description: Scheduler/admin-only. Requires a bearer token matching SESSION_SECRET.
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreAdminOrders"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /group-orders/admin/sweep:
    post:
      operationId: sweepOrders
      tags: [group-orders]
      summary: Expire overdue orders
      description: Marks unpaid lines on past-due orders expired and converts paid split shares to credit.
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SweepResult"
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Confirm the signed-in user is approved staff
      description: Returns the staff member's email when the Clerk session belongs to an allow-listed staff email; 403 otherwise.
      responses:
        "200":
          description: Staff session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Admin overview statistics
      description: Revenue by currency, voucher counts by status, and outstanding/failed instalment totals.
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/orders:
    get:
      operationId: getAdminOrdersDetailed
      tags: [admin]
      summary: All storefront orders with full instalment detail
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrders"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/orders/{orderId}/instalments/{instalmentId}/retry:
    post:
      operationId: retryInstalment
      tags: [admin]
      summary: Retry a failed instalment immediately
      description: Charges the saved card off-session for a specific failed/needs-action instalment. Idempotent per attempt.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: instalmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retry result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryInstalmentResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Instalment not in a retryable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      tags: [admin]
      summary: Cancel an order and stop its remaining instalments
      description: Marks the order cancelled and stops any scheduled/failed/needs-action instalments so no further charges are attempted. No refunds.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancel result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelOrderResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/group-orders:
    get:
      operationId: getAdminGroupOrders
      tags: [admin]
      summary: All group/split orders with per-share status and progress
      description: >-
        Group ordering orders (independent, flat and split) with each
        participant share's paid/pending/expired status, per-paid-share receipt,
        paid-vs-total progress, and whether a split order's combined master
        voucher has been released (only once every share is paid).
      responses:
        "200":
          description: Group orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGroupOrders"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/vouchers:
    post:
      operationId: issueVoucher
      tags: [admin]
      summary: Manually issue a voucher
      description: Generates a new active voucher with the given value, currency and expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueVoucherInput"
      responses:
        "200":
          description: Voucher issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVoucher"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/vouchers/{code}:
    get:
      operationId: lookupVoucher
      tags: [admin]
      summary: Look up a voucher by code
      description: Returns the voucher and a validity verdict (valid / invalid with a reason).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherLookup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/vouchers/{code}/redeem:
    post:
      operationId: redeemVoucher
      tags: [admin]
      summary: Redeem a valid voucher (one-time full use)
      description: Atomically marks a valid voucher redeemed with a timestamp. Fails for invalid, expired or already-redeemed vouchers.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redeem result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherLookup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Voucher cannot be redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherLookup"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Failed to generate upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [Storage]
      summary: Serve an uploaded object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storefront/gallery:
    get:
      operationId: getStorefrontGallery
      tags: [storefront]
      summary: Public property photo gallery
      description: Active gallery images for the storefront, ordered for display.
      responses:
        "200":
          description: Gallery images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryImageList"
  /admin/gallery:
    get:
      operationId: getAdminGallery
      tags: [admin]
      summary: List all gallery images (staff)
      responses:
        "200":
          description: Gallery images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryImageList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: addGalleryImage
      tags: [admin]
      summary: Register an uploaded gallery image (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGalleryImageInput"
      responses:
        "200":
          description: Created image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryImage"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/gallery/reorder:
    post:
      operationId: reorderGallery
      tags: [admin]
      summary: Reorder gallery images (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderGalleryInput"
      responses:
        "200":
          description: Updated gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryImageList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/gallery/{imageId}:
    patch:
      operationId: updateGalleryImage
      tags: [admin]
      summary: Update a gallery image's caption or visibility (staff)
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGalleryImageInput"
      responses:
        "200":
          description: Updated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryImage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteGalleryImage
      tags: [admin]
      summary: Delete a gallery image (staff)
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/catalog-prices:
    get:
      operationId: getAdminCatalogPrices
      tags: [admin]
      summary: List editable voucher prices (staff)
      responses:
        "200":
          description: Editable catalog prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogPrices"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/catalog-prices/{itemId}:
    put:
      operationId: updateCatalogPrice
      tags: [admin]
      summary: Update a voucher's price (staff)
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogPriceInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogPriceItem"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    OkResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    AdminCatalogPriceItem:
      type: object
      required: [id, name, rate, was, min_nights]
      properties:
        id:
          type: string
        name:
          type: string
        rate:
          type: number
          description: Per-night price in the storefront currency
        was:
          type: number
          description: Original per-night price (struck through)
        min_nights:
          type: integer
    AdminCatalogPrices:
      type: object
      required: [currency, symbol, items]
      properties:
        currency:
          type: string
        symbol:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminCatalogPriceItem"
    UpdateCatalogPriceInput:
      type: object
      required: [rate, was]
      properties:
        rate:
          type: number
        was:
          type: number
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    GalleryImage:
      type: object
      required: [id, object_path, url, alt, sort_order, active, created_at]
      properties:
        id:
          type: string
        object_path:
          type: string
        url:
          type: string
          description: Serving URL for the image, relative to the site origin
        alt:
          type: string
        sort_order:
          type: integer
        active:
          type: boolean
        created_at:
          type: string
    GalleryImageList:
      type: array
      items:
        $ref: "#/components/schemas/GalleryImage"
    AddGalleryImageInput:
      type: object
      required: [object_path]
      properties:
        object_path:
          type: string
          minLength: 1
        alt:
          type: string
    UpdateGalleryImageInput:
      type: object
      properties:
        alt:
          type: string
        active:
          type: boolean
    ReorderGalleryInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
    RateTable:
      type: object
      required: [currency, minor_per_major, rates]
      properties:
        currency:
          type: string
        minor_per_major:
          type: integer
        rates:
          type: object
          required: [one_bedroom, two_bedroom]
          properties:
            one_bedroom:
              type: integer
            two_bedroom:
              type: integer
    GroupOrderInput:
      type: object
      required: [mode, organiser_email, lines]
      properties:
        mode:
          type: string
          enum: [independent, split, flat]
        organiser_name:
          type: ["string", "null"]
          description: Optional; defaults to the organiser email (e.g. flat mode)
        organiser_email:
          type: string
          minLength: 1
        due_by:
          type: ["string", "null"]
          description: ISO 8601 pay-by deadline
        per_person_minor:
          type: ["integer", "null"]
          description: Per-person amount in minor units; required for flat mode
        split:
          anyOf:
            - $ref: "#/components/schemas/SplitConfig"
            - type: "null"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineInput"
    SplitConfig:
      type: object
      description: >-
        Defines the single voucher being split. Provide either apartment_type +
        nights (apartment package, priced server-side from the catalog) or
        amount_minor (open-value gift voucher total from the buyer).
      properties:
        apartment_type:
          type: ["string", "null"]
          enum: [one_bedroom, two_bedroom, null]
        nights:
          type: ["integer", "null"]
          minimum: 1
        amount_minor:
          type: ["integer", "null"]
          minimum: 1
          description: >-
            Open-value split total in minor units (gift vouchers); used instead
            of apartment_type + nights
    LineInput:
      type: object
      required: [payer_email]
      properties:
        payer_name:
          type: ["string", "null"]
          description: Optional; defaults to the payer email (e.g. flat mode)
        payer_email:
          type: string
          minLength: 1
        apartment_type:
          type: ["string", "null"]
          enum: [one_bedroom, two_bedroom, null]
          description: Required in independent mode
        nights:
          type: ["integer", "null"]
          description: Required in independent mode
        share_minor:
          type: ["integer", "null"]
          description: Optional explicit share for split mode (minor units)
    GroupOrderCreated:
      type: object
      required: [order_id, status_token, organiser_url, lines]
      properties:
        order_id:
          type: string
        status_token:
          type: string
        organiser_url:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CreatedLine"
    CreatedLine:
      type: object
      required: [id, payer_name, payer_email, amount_minor, pay_link]
      properties:
        id:
          type: string
        payer_name:
          type: string
        payer_email:
          type: string
        amount_minor:
          type: integer
        pay_link:
          type: string
    OrganiserView:
      type: object
      required:
        - mode
        - status
        - currency
        - organiser_name
        - paid_count
        - total_count
        - lines
      properties:
        mode:
          type: string
        status:
          type: string
        currency:
          type: string
        organiser_name:
          type: string
        due_by:
          type: ["string", "null"]
        split_apartment_type:
          type: ["string", "null"]
        split_nights:
          type: ["integer", "null"]
        split_amount_major:
          type: ["number", "null"]
          description: Open-value (gift) split total in major units, when applicable
        split_voucher_code:
          type: ["string", "null"]
        paid_count:
          type: integer
        total_count:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrganiserLine"
    OrganiserLine:
      type: object
      required: [id, payer_name, payer_email, amount_major, status, pay_link]
      properties:
        id:
          type: string
        payer_name:
          type: string
        payer_email:
          type: string
        amount_major:
          type: number
        status:
          type: string
        voucher_code:
          type: ["string", "null"]
        credit_code:
          type: ["string", "null"]
        apartment_type:
          type: ["string", "null"]
        nights:
          type: ["integer", "null"]
        pay_link:
          type: string
    ResendResult:
      type: object
      required: [pay_link, payer_email, status]
      properties:
        pay_link:
          type: string
        payer_email:
          type: string
        status:
          type: string
    PayLine:
      type: object
      required:
        - payer_name
        - amount_major
        - currency
        - description
        - status
        - payable
      properties:
        payer_name:
          type: string
        amount_major:
          type: number
        currency:
          type: string
        description:
          type: string
        status:
          type: string
        payable:
          type: boolean
        voucher_code:
          type: ["string", "null"]
        organiser_name:
          type: string
        order_number:
          type: ["string", "null"]
          description: Human-readable order reference for this group order
    CheckoutSession:
      type: object
      required: [url]
      properties:
        url:
          type: string
    SweepResult:
      type: object
      required: [swept]
      properties:
        swept:
          type: integer
    StorefrontCatalogItem:
      type: object
      required: [id, type, ribbon, featured, name, rate, was, minNights, desc, feat]
      properties:
        id:
          type: string
        type:
          type: string
        ribbon:
          type: string
        featured:
          type: boolean
        name:
          type: string
        rate:
          type: number
          description: Per-night price in the storefront currency
        was:
          type: number
          description: Original per-night price (struck through)
        minNights:
          type: integer
          description: Minimum number of nights that can be booked
        desc:
          type: string
        feat:
          type: array
          items:
            type: string
    StorefrontGift:
      type: object
      required: [id, type, name, amounts, min]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        amounts:
          type: array
          items:
            type: number
        min:
          type: number
    StorefrontConfig:
      type: object
      required:
        - publishable_key
        - payments_enabled
        - currency
        - symbol
        - instalments
        - interval_days
        - catalog
        - gift
      properties:
        publishable_key:
          type: string
        payments_enabled:
          type: boolean
        currency:
          type: string
        symbol:
          type: string
        instalments:
          type: integer
        interval_days:
          type: integer
        catalog:
          type: array
          items:
            $ref: "#/components/schemas/StorefrontCatalogItem"
        gift:
          $ref: "#/components/schemas/StorefrontGift"
    StoreOrderInput:
      type: object
      required: [name, email]
      properties:
        product_id:
          type: ["string", "null"]
        type:
          type: string
          enum: [package, gift]
        amount:
          type: ["number", "null"]
          description: Required for gift vouchers (open value)
        nights:
          type: ["integer", "null"]
          description: Number of nights for an apartment order (must be >= the item's minNights)
        plan:
          type: ["string", "null"]
          description: '"3" (or the instalment count) for Pay-in-3, otherwise pay in full'
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
    StoreOrderCreated:
      type: object
      required: [order_id, client_secret]
      properties:
        order_id:
          type: string
        client_secret:
          type: string
    StoreOrderConfirmation:
      type: object
      required: [status, paid_instalments, installments]
      properties:
        status:
          type: string
        order_number:
          type: ["string", "null"]
          description: Human-readable order reference for this order
        paid_instalments:
          type: integer
        installments:
          type: integer
        voucher:
          anyOf:
            - $ref: "#/components/schemas/StoreVoucherSummary"
            - type: "null"
    StoreVoucherSummary:
      type: object
      required: [code, status]
      properties:
        code:
          type: string
        status:
          type: string
    ChargeInstalmentsResult:
      type: object
      required: [processed]
      properties:
        processed:
          type: integer
    StoreInstallmentSummary:
      type: object
      required: [number, amount_major, due_at, status]
      properties:
        number:
          type: integer
        amount_major:
          type: number
        due_at:
          type: string
        status:
          type: string
    StoreAdminOrder:
      type: object
      required:
        - id
        - product_name
        - buyer_name
        - buyer_email
        - currency
        - total_major
        - installments
        - paid_instalments
        - status
        - created_at
        - schedule
      properties:
        id:
          type: string
        product_name:
          type: string
        buyer_name:
          type: string
        buyer_email:
          type: string
        currency:
          type: string
        total_major:
          type: number
        installments:
          type: integer
        paid_instalments:
          type: integer
        status:
          type: string
        created_at:
          type: string
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/StoreInstallmentSummary"
        voucher:
          anyOf:
            - $ref: "#/components/schemas/StoreVoucherSummary"
            - type: "null"
    StoreAdminOrders:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/StoreAdminOrder"
    DashboardVoucher:
      type: object
      required: [kind, code, source, status, currency]
      properties:
        kind:
          type: string
          enum: [voucher, credit]
          description: Whether this code is a redeemable voucher or residual credit
        code:
          type: string
        source:
          type: string
          enum: [storefront, group]
          description: Which flow issued the code
        status:
          type: string
        currency:
          type: string
        value_minor:
          type: ["integer", "null"]
          description: Face value in minor units, when known
        expires_at:
          type: ["string", "null"]
        created_at:
          type: ["string", "null"]
        pending:
          type: boolean
          description: >-
            True for a split-share voucher that is not yet released — the
            combined master voucher is held until every share in the group is
            paid. When true, no redeemable code is shown.
    DashboardPayment:
      type: object
      required:
        - id
        - source
        - description
        - amount_minor
        - currency
        - status
      properties:
        id:
          type: string
        source:
          type: string
          enum: [storefront, group]
        description:
          type: string
        amount_minor:
          type: integer
          description: Amount paid in minor units
        currency:
          type: string
        status:
          type: string
        paid_at:
          type: ["string", "null"]
        receipt_url:
          type: ["string", "null"]
          description: Hosted Stripe receipt URL, when available
    DashboardOrganisedLine:
      type: object
      required: [id, payer_name, payer_email, amount_minor, status, pay_link]
      properties:
        id:
          type: string
        payer_name:
          type: string
        payer_email:
          type: string
        amount_minor:
          type: integer
          description: Share amount in minor units
        status:
          type: string
          description: paid / pending / expired
        voucher_code:
          type: ["string", "null"]
        credit_code:
          type: ["string", "null"]
        apartment_type:
          type: ["string", "null"]
        nights:
          type: ["integer", "null"]
        pay_link:
          type: string
          description: Relative payment link for this participant's share
    DashboardOrganisedOrder:
      type: object
      required:
        - id
        - mode
        - status
        - currency
        - paid_count
        - total_count
        - paid_minor
        - total_minor
        - lines
      properties:
        id:
          type: string
          description: Group order id, used to send owner-scoped reminders
        mode:
          type: string
        status:
          type: string
        currency:
          type: string
        due_by:
          type: ["string", "null"]
        paid_count:
          type: integer
        total_count:
          type: integer
        paid_minor:
          type: integer
          description: Sum of paid shares in minor units
        total_minor:
          type: integer
          description: Sum of all shares in minor units
        master_voucher_code:
          type: ["string", "null"]
          description: The combined master voucher code, present once a split order is complete
        split_apartment_type:
          type: ["string", "null"]
        split_nights:
          type: ["integer", "null"]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DashboardOrganisedLine"
    DashboardInstalment:
      type: object
      required: [number, amount_minor, status, payable]
      properties:
        number:
          type: integer
          description: 1-based instalment number (1 is the checkout payment)
        amount_minor:
          type: integer
          description: Instalment amount in minor units
        due_at:
          type: ["string", "null"]
        status:
          type: string
          description: paid / scheduled / charging / failed / needs_action / expired / cancelled / pending
        paid_at:
          type: ["string", "null"]
        receipt_url:
          type: ["string", "null"]
        payable:
          type: boolean
          description: True when this upcoming instalment can be paid in advance now
    DashboardOrder:
      type: object
      required:
        - id
        - product_name
        - currency
        - total_minor
        - installments
        - paid_instalments
        - status
        - has_upcoming
        - schedule
      properties:
        id:
          type: string
        order_number:
          type: ["string", "null"]
        product_name:
          type: string
        currency:
          type: string
        total_minor:
          type: integer
        installments:
          type: integer
        paid_instalments:
          type: integer
        status:
          type: string
        created_at:
          type: ["string", "null"]
        has_upcoming:
          type: boolean
          description: True when at least one instalment can be paid in advance now
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/DashboardInstalment"
    PayInstalmentsBody:
      type: object
      properties:
        numbers:
          type: array
          description: Instalment numbers to pay; omit or leave empty to pay all remaining upcoming instalments
          items:
            type: integer
    PayInstalmentResult:
      type: object
      required: [number, status]
      properties:
        number:
          type: integer
        status:
          type: string
          enum: [paid, skipped, needs_action, failed]
        error:
          type: ["string", "null"]
    PayInstalmentsResult:
      type: object
      required: [results, order]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PayInstalmentResult"
        order:
          $ref: "#/components/schemas/DashboardOrder"
    DashboardView:
      type: object
      required: [email, vouchers, payments, orders, organised_orders]
      properties:
        email:
          type: string
          description: The verified account email all records are scoped to
        vouchers:
          type: array
          items:
            $ref: "#/components/schemas/DashboardVoucher"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/DashboardPayment"
        orders:
          type: array
          description: Storefront orders with their full instalment schedule
          items:
            $ref: "#/components/schemas/DashboardOrder"
        organised_orders:
          type: array
          description: Group orders this account created as the organiser, any status
          items:
            $ref: "#/components/schemas/DashboardOrganisedOrder"
    AdminSession:
      type: object
      required: [email, staff]
      properties:
        email:
          type: string
        staff:
          type: boolean
    CurrencyAmount:
      type: object
      required: [currency, amount_minor]
      properties:
        currency:
          type: string
        amount_minor:
          type: integer
    CurrencyCount:
      type: object
      required: [currency, count, amount_minor]
      properties:
        currency:
          type: string
        count:
          type: integer
        amount_minor:
          type: integer
    AdminOverview:
      type: object
      required:
        - revenue
        - vouchers_issued
        - vouchers_active
        - vouchers_redeemed
        - outstanding_count
        - outstanding
        - failed_count
        - failed
      properties:
        revenue:
          type: array
          description: Collected revenue grouped by currency
          items:
            $ref: "#/components/schemas/CurrencyAmount"
        vouchers_issued:
          type: integer
        vouchers_active:
          type: integer
        vouchers_redeemed:
          type: integer
        outstanding_count:
          type: integer
          description: Count of scheduled (not yet charged) instalments
        outstanding:
          type: array
          description: Scheduled instalment totals grouped by currency
          items:
            $ref: "#/components/schemas/CurrencyCount"
        failed_count:
          type: integer
          description: Count of failed / needs-action instalments
        failed:
          type: array
          description: Failed / needs-action instalment totals grouped by currency
          items:
            $ref: "#/components/schemas/CurrencyCount"
    AdminInstalment:
      type: object
      required: [id, number, amount_minor, currency, due_at, status, attempts]
      properties:
        id:
          type: string
        number:
          type: integer
        amount_minor:
          type: integer
        currency:
          type: string
        due_at:
          type: string
        status:
          type: string
        attempts:
          type: integer
        last_error:
          type: ["string", "null"]
    AdminOrder:
      type: object
      required:
        - id
        - product_name
        - buyer_name
        - buyer_email
        - currency
        - total_minor
        - installments
        - paid_instalments
        - status
        - created_at
        - first_payment
        - instalments
      properties:
        id:
          type: string
        order_number:
          type: ["string", "null"]
          description: Human-readable order reference for this order
        product_name:
          type: string
        buyer_name:
          type: string
        buyer_email:
          type: string
        currency:
          type: string
        total_minor:
          type: integer
        installments:
          type: integer
        paid_instalments:
          type: integer
        status:
          type: string
        created_at:
          type: string
        first_payment:
          $ref: "#/components/schemas/AdminInstalment"
        instalments:
          type: array
          description: Scheduled instalments 2..N (excludes the first payment)
          items:
            $ref: "#/components/schemas/AdminInstalment"
        voucher:
          anyOf:
            - $ref: "#/components/schemas/StoreVoucherSummary"
            - type: "null"
    AdminOrders:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrder"
    AdminGroupParticipant:
      type: object
      required: [id, payer_name, payer_email, amount_minor, status]
      properties:
        id:
          type: string
        payer_name:
          type: string
        payer_email:
          type: string
        amount_minor:
          type: integer
        status:
          type: string
          description: paid, pending or expired
        paid_at:
          type: ["string", "null"]
        receipt_url:
          type: ["string", "null"]
          description: Hosted Stripe receipt URL for a paid share, when available
        voucher_code:
          type: ["string", "null"]
          description: Per-share voucher (independent/flat modes); null in split mode
        credit_code:
          type: ["string", "null"]
          description: Residual store credit issued when a paid share expires
    AdminGroupOrder:
      type: object
      required:
        - id
        - mode
        - status
        - organiser_name
        - organiser_email
        - currency
        - created_at
        - paid_count
        - total_count
        - paid_minor
        - total_minor
        - voucher_released
        - participants
      properties:
        id:
          type: string
        order_number:
          type: ["string", "null"]
          description: Human-readable order reference for this group order
        mode:
          type: string
          description: independent, flat or split
        status:
          type: string
          description: open, complete or expired
        organiser_name:
          type: string
        organiser_email:
          type: string
        currency:
          type: string
        created_at:
          type: string
        due_by:
          type: ["string", "null"]
        split_apartment_type:
          type: ["string", "null"]
        split_nights:
          type: ["integer", "null"]
        split_voucher_code:
          type: ["string", "null"]
          description: >-
            Combined master voucher for a split order; null until every share is
            paid and the voucher is released.
        voucher_released:
          type: boolean
          description: >-
            True for a split order whose combined master voucher has been
            released (all shares paid). Always false while partially paid.
        paid_count:
          type: integer
        total_count:
          type: integer
        paid_minor:
          type: integer
          description: Sum of paid shares in minor units (paid-so-far)
        total_minor:
          type: integer
          description: Sum of all shares in minor units (order total)
        participants:
          type: array
          items:
            $ref: "#/components/schemas/AdminGroupParticipant"
    AdminGroupOrders:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/AdminGroupOrder"
    RetryInstalmentResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Outcome — paid, processing, failed or needs_action
        message:
          type: ["string", "null"]
    CancelOrderResult:
      type: object
      required: [status, cancelled_instalments]
      properties:
        status:
          type: string
        cancelled_instalments:
          type: integer
    IssueVoucherInput:
      type: object
      required: [value_minor, currency, expires_at]
      properties:
        value_minor:
          type: integer
          minimum: 1
        currency:
          type: string
          minLength: 1
        expires_at:
          type: string
          description: ISO 8601 expiry date
    AdminVoucher:
      type: object
      required: [id, code, value_minor, currency, status, expires_at, created_at]
      properties:
        id:
          type: string
        code:
          type: string
        value_minor:
          type: integer
        currency:
          type: string
        status:
          type: string
        expires_at:
          type: ["string", "null"]
        redeemed_at:
          type: ["string", "null"]
        created_at:
          type: string
        order_id:
          type: ["string", "null"]
    VoucherLookup:
      type: object
      required: [found, valid]
      properties:
        found:
          type: boolean
        valid:
          type: boolean
          description: Whether the voucher can be redeemed right now
        reason:
          type: ["string", "null"]
          description: Why the voucher is invalid (not_found, expired, already_redeemed, not_active)
        voucher:
          anyOf:
            - $ref: "#/components/schemas/AdminVoucher"
            - type: "null"
