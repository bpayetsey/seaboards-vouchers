openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rates
    description: Voucher rate information
  - name: group-orders
    description: Group voucher orders
  - name: pay
    description: Per-person payment links
  - name: storefront
    description: Direct voucher storefront with Pay-in-3 instalments
  - name: dashboard
    description: Authenticated client account dashboard
  - name: admin
    description: Staff admin dashboard (Clerk session + staff allow-list)
paths:
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the signed-in client's account dashboard
      description: >
        Returns all vouchers/credits, payments and downloadable Stripe receipts
        belonging to the authenticated client, matched strictly to their verified
        account email. Requires a Clerk session.
      responses:
        "200":
          description: Dashboard view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardView"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A verified email is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rates:
    get:
      operationId: getRates
      tags: [rates]
      summary: Get voucher rate table
      description: Authoritative apartment rate table used to price vouchers.
      responses:
        "200":
          description: Rate table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateTable"
  /group-orders:
    post:
      operationId: createGroupOrder
      tags: [group-orders]
      summary: Create a group voucher order
      description: >
        Creates a group order plus one payable line per person and returns the
        organiser status URL and a payment link for each payer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupOrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupOrderCreated"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /group-orders/{statusToken}:
    get:
      operationId: getGroupOrder
      tags: [group-orders]
      summary: Get organiser status view
      parameters:
        - name: statusToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organiser view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganiserView"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /group-orders/{statusToken}/lines/{lineId}/resend:
    post:
      operationId: resendLine
      tags: [group-orders]
      summary: Re-surface a payer's payment link
      parameters:
        - name: statusToken
          in: path
          required: true
          schema:
            type: string
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resend result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pay/{payToken}:
    get:
      operationId: getPayLine
      tags: [pay]
      summary: Get a payer's line details
      parameters:
        - name: payToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pay line details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayLine"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pay/{payToken}/checkout:
    post:
      operationId: createCheckout
      tags: [pay]
      summary: Create a Stripe Checkout session for a payer
      description: >
        Mints a fresh Stripe Checkout session for this payer's line and returns
        the hosted checkout URL to redirect to.
      parameters:
        - name: payToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already paid or closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Payments not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storefront/config:
    get:
      operationId: getStorefrontConfig
      tags: [storefront]
      summary: Storefront campaign config
      description: Catalog, currency, instalment settings and the Stripe publishable key.
      responses:
        "200":
          description: Storefront config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontConfig"
  /storefront/orders:
    post:
      operationId: createStoreOrder
      tags: [storefront]
      summary: Create a storefront order
      description: >
        Creates the order plus the first PaymentIntent (full payment or instalment
        #1 with the card saved for off-session instalments) and returns the
        client secret for the Stripe Payment Element.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOrderInput"
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderCreated"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Payments not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storefront/orders/{orderId}/confirm:
    post:
      operationId: confirmStoreOrder
      tags: [storefront]
      summary: Finalize an order after the browser confirms
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderConfirmation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storefront/jobs/charge-instalments:
    post:
      operationId: chargeInstalments
      tags: [storefront]
      summary: Charge due instalments off-session
      description: Scheduler-only. Requires a bearer token matching SESSION_SECRET.
      responses:
        "200":
          description: Job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeInstalmentsResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /storefront/admin/orders:
    get:
      operationId: getStoreAdminOrders
      tags: [storefront]
      summary: Recent storefront orders
      description: Scheduler/admin-only. Requires a bearer token matching SESSION_SECRET.
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreAdminOrders"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /group-orders/admin/sweep:
    post:
      operationId: sweepOrders
      tags: [group-orders]
      summary: Expire overdue orders
      description: Marks unpaid lines on past-due orders expired and converts paid split shares to credit.
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SweepResult"
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Confirm the signed-in user is approved staff
      description: Returns the staff member's email when the Clerk session belongs to an allow-listed staff email; 403 otherwise.
      responses:
        "200":
          description: Staff session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Admin overview statistics
      description: Revenue by currency, voucher counts by status, and outstanding/failed instalment totals.
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/orders:
    get:
      operationId: getAdminOrdersDetailed
      tags: [admin]
      summary: All storefront orders with full instalment detail
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrders"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/orders/{orderId}/instalments/{instalmentId}/retry:
    post:
      operationId: retryInstalment
      tags: [admin]
      summary: Retry a failed instalment immediately
      description: Charges the saved card off-session for a specific failed/needs-action instalment. Idempotent per attempt.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: instalmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retry result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryInstalmentResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Instalment not in a retryable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      tags: [admin]
      summary: Cancel an order and stop its remaining instalments
      description: Marks the order cancelled and stops any scheduled/failed/needs-action instalments so no further charges are attempted. No refunds.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancel result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelOrderResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/vouchers:
    post:
      operationId: issueVoucher
      tags: [admin]
      summary: Manually issue a voucher
      description: Generates a new active voucher with the given value, currency and expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueVoucherInput"
      responses:
        "200":
          description: Voucher issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVoucher"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/vouchers/{code}:
    get:
      operationId: lookupVoucher
      tags: [admin]
      summary: Look up a voucher by code
      description: Returns the voucher and a validity verdict (valid / invalid with a reason).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherLookup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/vouchers/{code}/redeem:
    post:
      operationId: redeemVoucher
      tags: [admin]
      summary: Redeem a valid voucher (one-time full use)
      description: Atomically marks a valid voucher redeemed with a timestamp. Fails for invalid, expired or already-redeemed vouchers.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redeem result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherLookup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not approved staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Voucher cannot be redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherLookup"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    RateTable:
      type: object
      required: [currency, minor_per_major, rates]
      properties:
        currency:
          type: string
        minor_per_major:
          type: integer
        rates:
          type: object
          required: [one_bedroom, two_bedroom]
          properties:
            one_bedroom:
              type: integer
            two_bedroom:
              type: integer
    GroupOrderInput:
      type: object
      required: [mode, organiser_email, lines]
      properties:
        mode:
          type: string
          enum: [independent, split, flat]
        organiser_name:
          type: ["string", "null"]
          description: Optional; defaults to the organiser email (e.g. flat mode)
        organiser_email:
          type: string
          minLength: 1
        due_by:
          type: ["string", "null"]
          description: ISO 8601 pay-by deadline
        per_person_minor:
          type: ["integer", "null"]
          description: Per-person amount in minor units; required for flat mode
        split:
          anyOf:
            - $ref: "#/components/schemas/SplitConfig"
            - type: "null"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineInput"
    SplitConfig:
      type: object
      required: [apartment_type, nights]
      properties:
        apartment_type:
          type: string
          enum: [one_bedroom, two_bedroom]
        nights:
          type: integer
          minimum: 1
    LineInput:
      type: object
      required: [payer_email]
      properties:
        payer_name:
          type: ["string", "null"]
          description: Optional; defaults to the payer email (e.g. flat mode)
        payer_email:
          type: string
          minLength: 1
        apartment_type:
          type: ["string", "null"]
          enum: [one_bedroom, two_bedroom, null]
          description: Required in independent mode
        nights:
          type: ["integer", "null"]
          description: Required in independent mode
        share_minor:
          type: ["integer", "null"]
          description: Optional explicit share for split mode (minor units)
    GroupOrderCreated:
      type: object
      required: [order_id, status_token, organiser_url, lines]
      properties:
        order_id:
          type: string
        status_token:
          type: string
        organiser_url:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CreatedLine"
    CreatedLine:
      type: object
      required: [id, payer_name, payer_email, amount_minor, pay_link]
      properties:
        id:
          type: string
        payer_name:
          type: string
        payer_email:
          type: string
        amount_minor:
          type: integer
        pay_link:
          type: string
    OrganiserView:
      type: object
      required:
        - mode
        - status
        - currency
        - organiser_name
        - paid_count
        - total_count
        - lines
      properties:
        mode:
          type: string
        status:
          type: string
        currency:
          type: string
        organiser_name:
          type: string
        due_by:
          type: ["string", "null"]
        split_apartment_type:
          type: ["string", "null"]
        split_nights:
          type: ["integer", "null"]
        split_voucher_code:
          type: ["string", "null"]
        paid_count:
          type: integer
        total_count:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrganiserLine"
    OrganiserLine:
      type: object
      required: [id, payer_name, payer_email, amount_major, status, pay_link]
      properties:
        id:
          type: string
        payer_name:
          type: string
        payer_email:
          type: string
        amount_major:
          type: number
        status:
          type: string
        voucher_code:
          type: ["string", "null"]
        credit_code:
          type: ["string", "null"]
        apartment_type:
          type: ["string", "null"]
        nights:
          type: ["integer", "null"]
        pay_link:
          type: string
    ResendResult:
      type: object
      required: [pay_link, payer_email, status]
      properties:
        pay_link:
          type: string
        payer_email:
          type: string
        status:
          type: string
    PayLine:
      type: object
      required:
        - payer_name
        - amount_major
        - currency
        - description
        - status
        - payable
      properties:
        payer_name:
          type: string
        amount_major:
          type: number
        currency:
          type: string
        description:
          type: string
        status:
          type: string
        payable:
          type: boolean
        voucher_code:
          type: ["string", "null"]
        organiser_name:
          type: string
    CheckoutSession:
      type: object
      required: [url]
      properties:
        url:
          type: string
    SweepResult:
      type: object
      required: [swept]
      properties:
        swept:
          type: integer
    StorefrontCatalogItem:
      type: object
      required: [id, type, ribbon, featured, name, rate, was, minNights, desc, feat]
      properties:
        id:
          type: string
        type:
          type: string
        ribbon:
          type: string
        featured:
          type: boolean
        name:
          type: string
        rate:
          type: number
          description: Per-night price in the storefront currency
        was:
          type: number
          description: Original per-night price (struck through)
        minNights:
          type: integer
          description: Minimum number of nights that can be booked
        desc:
          type: string
        feat:
          type: array
          items:
            type: string
    StorefrontGift:
      type: object
      required: [id, type, name, amounts, min]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        amounts:
          type: array
          items:
            type: number
        min:
          type: number
    StorefrontConfig:
      type: object
      required:
        - publishable_key
        - payments_enabled
        - currency
        - symbol
        - instalments
        - interval_days
        - catalog
        - gift
      properties:
        publishable_key:
          type: string
        payments_enabled:
          type: boolean
        currency:
          type: string
        symbol:
          type: string
        instalments:
          type: integer
        interval_days:
          type: integer
        catalog:
          type: array
          items:
            $ref: "#/components/schemas/StorefrontCatalogItem"
        gift:
          $ref: "#/components/schemas/StorefrontGift"
    StoreOrderInput:
      type: object
      required: [name, email]
      properties:
        product_id:
          type: ["string", "null"]
        type:
          type: string
          enum: [package, gift]
        amount:
          type: ["number", "null"]
          description: Required for gift vouchers (open value)
        nights:
          type: ["integer", "null"]
          description: Number of nights for an apartment order (must be >= the item's minNights)
        plan:
          type: ["string", "null"]
          description: '"3" (or the instalment count) for Pay-in-3, otherwise pay in full'
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
    StoreOrderCreated:
      type: object
      required: [order_id, client_secret]
      properties:
        order_id:
          type: string
        client_secret:
          type: string
    StoreOrderConfirmation:
      type: object
      required: [status, paid_instalments, installments]
      properties:
        status:
          type: string
        paid_instalments:
          type: integer
        installments:
          type: integer
        voucher:
          anyOf:
            - $ref: "#/components/schemas/StoreVoucherSummary"
            - type: "null"
    StoreVoucherSummary:
      type: object
      required: [code, status]
      properties:
        code:
          type: string
        status:
          type: string
    ChargeInstalmentsResult:
      type: object
      required: [processed]
      properties:
        processed:
          type: integer
    StoreInstallmentSummary:
      type: object
      required: [number, amount_major, due_at, status]
      properties:
        number:
          type: integer
        amount_major:
          type: number
        due_at:
          type: string
        status:
          type: string
    StoreAdminOrder:
      type: object
      required:
        - id
        - product_name
        - buyer_name
        - buyer_email
        - currency
        - total_major
        - installments
        - paid_instalments
        - status
        - created_at
        - schedule
      properties:
        id:
          type: string
        product_name:
          type: string
        buyer_name:
          type: string
        buyer_email:
          type: string
        currency:
          type: string
        total_major:
          type: number
        installments:
          type: integer
        paid_instalments:
          type: integer
        status:
          type: string
        created_at:
          type: string
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/StoreInstallmentSummary"
        voucher:
          anyOf:
            - $ref: "#/components/schemas/StoreVoucherSummary"
            - type: "null"
    StoreAdminOrders:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/StoreAdminOrder"
    DashboardVoucher:
      type: object
      required: [kind, code, source, status, currency]
      properties:
        kind:
          type: string
          enum: [voucher, credit]
          description: Whether this code is a redeemable voucher or residual credit
        code:
          type: string
        source:
          type: string
          enum: [storefront, group]
          description: Which flow issued the code
        status:
          type: string
        currency:
          type: string
        value_minor:
          type: ["integer", "null"]
          description: Face value in minor units, when known
        expires_at:
          type: ["string", "null"]
        created_at:
          type: ["string", "null"]
    DashboardPayment:
      type: object
      required:
        - id
        - source
        - description
        - amount_minor
        - currency
        - status
      properties:
        id:
          type: string
        source:
          type: string
          enum: [storefront, group]
        description:
          type: string
        amount_minor:
          type: integer
          description: Amount paid in minor units
        currency:
          type: string
        status:
          type: string
        paid_at:
          type: ["string", "null"]
        receipt_url:
          type: ["string", "null"]
          description: Hosted Stripe receipt URL, when available
    DashboardView:
      type: object
      required: [email, vouchers, payments]
      properties:
        email:
          type: string
          description: The verified account email all records are scoped to
        vouchers:
          type: array
          items:
            $ref: "#/components/schemas/DashboardVoucher"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/DashboardPayment"
    AdminSession:
      type: object
      required: [email, staff]
      properties:
        email:
          type: string
        staff:
          type: boolean
    CurrencyAmount:
      type: object
      required: [currency, amount_minor]
      properties:
        currency:
          type: string
        amount_minor:
          type: integer
    CurrencyCount:
      type: object
      required: [currency, count, amount_minor]
      properties:
        currency:
          type: string
        count:
          type: integer
        amount_minor:
          type: integer
    AdminOverview:
      type: object
      required:
        - revenue
        - vouchers_issued
        - vouchers_active
        - vouchers_redeemed
        - outstanding_count
        - outstanding
        - failed_count
        - failed
      properties:
        revenue:
          type: array
          description: Collected revenue grouped by currency
          items:
            $ref: "#/components/schemas/CurrencyAmount"
        vouchers_issued:
          type: integer
        vouchers_active:
          type: integer
        vouchers_redeemed:
          type: integer
        outstanding_count:
          type: integer
          description: Count of scheduled (not yet charged) instalments
        outstanding:
          type: array
          description: Scheduled instalment totals grouped by currency
          items:
            $ref: "#/components/schemas/CurrencyCount"
        failed_count:
          type: integer
          description: Count of failed / needs-action instalments
        failed:
          type: array
          description: Failed / needs-action instalment totals grouped by currency
          items:
            $ref: "#/components/schemas/CurrencyCount"
    AdminInstalment:
      type: object
      required: [id, number, amount_minor, currency, due_at, status, attempts]
      properties:
        id:
          type: string
        number:
          type: integer
        amount_minor:
          type: integer
        currency:
          type: string
        due_at:
          type: string
        status:
          type: string
        attempts:
          type: integer
        last_error:
          type: ["string", "null"]
    AdminOrder:
      type: object
      required:
        - id
        - product_name
        - buyer_name
        - buyer_email
        - currency
        - total_minor
        - installments
        - paid_instalments
        - status
        - created_at
        - first_payment
        - instalments
      properties:
        id:
          type: string
        product_name:
          type: string
        buyer_name:
          type: string
        buyer_email:
          type: string
        currency:
          type: string
        total_minor:
          type: integer
        installments:
          type: integer
        paid_instalments:
          type: integer
        status:
          type: string
        created_at:
          type: string
        first_payment:
          $ref: "#/components/schemas/AdminInstalment"
        instalments:
          type: array
          description: Scheduled instalments 2..N (excludes the first payment)
          items:
            $ref: "#/components/schemas/AdminInstalment"
        voucher:
          anyOf:
            - $ref: "#/components/schemas/StoreVoucherSummary"
            - type: "null"
    AdminOrders:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrder"
    RetryInstalmentResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Outcome — paid, processing, failed or needs_action
        message:
          type: ["string", "null"]
    CancelOrderResult:
      type: object
      required: [status, cancelled_instalments]
      properties:
        status:
          type: string
        cancelled_instalments:
          type: integer
    IssueVoucherInput:
      type: object
      required: [value_minor, currency, expires_at]
      properties:
        value_minor:
          type: integer
          minimum: 1
        currency:
          type: string
          minLength: 1
        expires_at:
          type: string
          description: ISO 8601 expiry date
    AdminVoucher:
      type: object
      required: [id, code, value_minor, currency, status, expires_at, created_at]
      properties:
        id:
          type: string
        code:
          type: string
        value_minor:
          type: integer
        currency:
          type: string
        status:
          type: string
        expires_at:
          type: ["string", "null"]
        redeemed_at:
          type: ["string", "null"]
        created_at:
          type: string
        order_id:
          type: ["string", "null"]
    VoucherLookup:
      type: object
      required: [found, valid]
      properties:
        found:
          type: boolean
        valid:
          type: boolean
          description: Whether the voucher can be redeemed right now
        reason:
          type: ["string", "null"]
          description: Why the voucher is invalid (not_found, expired, already_redeemed, not_active)
        voucher:
          anyOf:
            - $ref: "#/components/schemas/AdminVoucher"
            - type: "null"
